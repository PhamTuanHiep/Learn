name: CI

on:
  push:
    branches: [main]      # chạy khi code đã vào main
  pull_request:
    branches: [main]      # chạy khi có PR nhắm vào main -> đây là cái "gác cổng" PR
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist-build
          path: dist
